<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Ayoub ELMORTAJI for cybersecurity and cloud opportunities.">
  <title>Contact | Ayoub ELMORTAJI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas class="canvas-layer" data-canvas aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="navbar">
    <div class="brand">Ayoub ELMORTAJI</div>
    <nav aria-label="Primary">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="awards.html">Awards</a>
        <a href="certifications.html">Certifications</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
    <div class="nav-actions">
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">Menu</button>
      <button class="toggle" type="button" data-scanlines-toggle aria-label="Toggle scanlines">Scanlines</button>
      <button class="toggle" type="button" data-terminal-toggle aria-label="Toggle terminal mode">Terminal</button>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <div class="section-title"><span>Contact</span> Let's Connect</div>
      <div class="card-grid">
        <article class="card">
          <div class="tag">Email</div>
          <p>elmortaji.ayoub@ensam-casa.ma</p>
          <div class="cta-group">
            <a class="btn" href="mailto:elmortaji.ayoub@ensam-casa.ma">Send Email</a>
            <button class="copy-btn" type="button" data-copy="elmortaji.ayoub@ensam-casa.ma">Copy</button>
          </div>
        </article>
        <article class="card">
          <div class="tag">Phone</div>
          <p>+212 625725861</p>
          <button class="copy-btn" type="button" data-copy="+212 625725861">Copy</button>
        </article>
        <article class="card">
          <div class="tag">Location</div>
          <p>Mohammedia, Morocco</p>
        </article>
      </div>

      <div class="section" style="padding-top: 32px;">
        <div class="section-title"><span>Message</span> Contact Form</div>
        <form class="form" aria-label="Contact form">
          <input class="input" type="text" name="name" placeholder="Your name" aria-label="Name">
          <input class="input" type="email" name="email" placeholder="Your email" aria-label="Email">
          <textarea class="input" name="message" placeholder="Tell me about your project..." aria-label="Message"></textarea>
          <button class="btn primary" type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-links">
      <a href="https://github.com/AyoubElmortaji" target="_blank" rel="noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/ayoub-elmortaji-805ab1250" target="_blank" rel="noreferrer">LinkedIn</a>
      <a href="mailto:elmortaji.ayoub@ensam-casa.ma">Email</a>
    </div>
  </footer>

  <div class="terminal-overlay" role="dialog" aria-label="Terminal mode">
    <div class="terminal-header">
      Terminal Mode
      <span>ESC</span>
    </div>
    <div class="terminal-body" data-terminal-body></div>
    <div class="terminal-input">
      <span>&gt;</span>
      <input type="text" data-terminal-input aria-label="Terminal input" placeholder="Type a command">
    </div>
  </div>

  <div class="palette" role="dialog" aria-label="Command palette">
    <div class="palette-panel">
      <input type="text" data-palette-input placeholder="Type to navigate..." aria-label="Command palette input">
      <div class="palette-results" data-palette-results></div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
